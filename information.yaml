global:
    ospf_proc: 100
    ospf_area: 0
    mask: 255.255.255.0
    ikev2_key: Cisco123
    tunnel_key: 12345
routers:
  - hostname: HUB_MAIN
    role: hub
    tunnel_ip: 172.16.1.1
    ip_management: 192.168.50.135
    tunnel_source: Ethernet0/0
    loopback0: 192.168.100.1
    mask: 255.255.255.0
    tunnels: 
    - id: 100
      ip: 172.16.1.1
      mask: 255.255.255.0
      tunnel_source: Ethernet0/0
      nhrp_network_id: 100
      tunnel_key: 12345
      ip_ospf_cost: 100
    - id: 200
      ip: 172.16.2.1
      mask: 255.255.255.0
      tunnel_source: Ethernet0/0
      nhrp_network_id: 200
      tunnel_key: 54321
      ip_ospf_cost: 200
    interface:
    - name: Ethernet0/0
      ip: 100.100.100.1
      gateway_ip: 100.100.100.2
      sla_id: 1
      track_id: 1
      mask: 255.255.255.0
  - hostname: HUB_DR
    role: hub
    ip_management: 192.168.50.137
    loopback0: 192.168.200.1
    mask: 255.255.255.0
    tunnels: 
    - id: 100
      ip: 172.16.1.2
      mask: 255.255.255.0
      tunnel_source: Ethernet0/1
      nhrp_network_id: 100
      tunnel_key: 12345
      ip_ospf_cost: 100
    - id: 200
      ip: 172.16.2.2
      mask: 255.255.255.0
      tunnel_source: Ethernet0/1
      nhrp_network_id: 200
      tunnel_key: 54321
      ip_ospf_cost: 200
    interface:
      - name: Ethernet0/1
        ip: 200.200.200.1
        gateway_ip: 200.200.200.2
        mask: 255.255.255.0
  - hostname: BRANCH_A
    role: spoke
    tunnel_ip: 172.16.1.3
    tunnel_source: Ethernet0/2
    ip_management: 192.168.50.139
    tunnels:
    - id: 100
      ip: 172.16.1.3
      mask: 255.255.255.0
      tunnel_source: Ethernet0/2
      nhrp_network_id : 100
      tunnel_key: 12345
      ip_ospf_cost: 100
      tunnel_vrf: INET1
    - id: 200
      ip: 172.16.2.3
      mask: 255.255.255.0
      tunnel_source: Ethernet0/3
      nhrp_network_id: 200
      tunnel_key: 54321
      ip_ospf_cost: 200
      tunnel_vrf: INET2
    interface:
      - name: Ethernet0/2
        description: Link_to_ISP
        ip: 10.10.10.1
        gateway_ip: 10.10.10.2
        mask: 255.255.255.0
        is_primary: true
        vrf: INET1
      - name: Ethernet0/3
        description: Link_to_ISP
        ip: 20.20.20.1
        gateway_ip: 20.20.20.2
        mask: 255.255.255.0
        is_primary: false
        vrf: INET2
      - name: Ethernet0/0
        description: Link_to_local
        ip: 192.168.1.1
        mask: 255.255.255.0
        ospf_enabled: true
  - hostname: BRANCH_C
    role: spoke
    tunnel_ip: 172.16.1.4
    tunnel_source: Ethernet0/2
    ip_management: 192.168.50.138
    tunnels:
    - id: 100
      ip: 172.16.1.4
      mask: 255.255.255.0
      tunnel_source: Ethernet0/0
      nhrp_network_id : 100
      tunnel_key: 12345
      ip_ospf_cost: 100
      tunnel_vrf: INET1
    - id: 200
      ip: 172.16.2.4
      mask: 255.255.255.0
      tunnel_source: Ethernet0/1
      nhrp_network_id: 200
      tunnel_key: 54321
      ip_ospf_cost: 200
      tunnel_vrf: INET2
    interface:
      - name: Ethernet0/0
        description: Link_to_ISP
        ip: 200.0.0.10
        gateway_ip: 200.0.0.1
        is_primary: true
        mask: 255.255.255.0
        vrf: INET1
      - name: Ethernet0/1
        description: Link_to_ISP
        ip: 200.0.1.10
        gateway_ip: 200.0.1.1
        is_primary: false
        vrf: INET2
        mask: 255.255.255.0
      - name: Ethernet0/2
        description: Link_to_local
        ip: 192.168.2.1
        mask: 255.255.255.0
        ospf_enabled: true


    
